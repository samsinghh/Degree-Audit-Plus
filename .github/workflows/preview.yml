# .github/workflows/preview.yml
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build preview
        run: bun run preview:build
        env:
          PREVIEW_BASE: /${{ github.event.repository.name }}/
      - name: Configure pages
        uses: actions/configure-pages@v6
      - name: Upload preview
        uses: actions/upload-pages-artifact@v5
        with:
          path: preview/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
